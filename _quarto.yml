project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "!cv/"

website:
  title: "Kira Wei"
#  description: "Kira Wei Website"
  navbar:
    left:
      - href: index.qmd
        text: About
      # - href: experience.qmd
      #   text: Experience
      - href: projects.qmd
        text: Data Science Projects
    right:
      - href: https://www.linkedin.com/in/mengjiawei/
        icon: linkedin
      - href: https://github.com/kirawei2025
        icon: github
      - href: "mailto:kiraofsimon@gmail.com"
        icon: envelope-fill
    background: primary
    search: true
  page-footer:
    center: |
      Made with&nbsp;[Quarto](https://quarto.org/)
    border: true
    background: dark
  site-url: "https://fortietwo.com"
  repo-url: "https://github.com/schoulten/schoulten.github.io"
  favicon: "images/kirawei.png"
  open-graph: true

lang: en
freeze: true

format:
  html:
    author: "Kira Wei"
    theme:
      - darkly
      - styles/css/custom-dark.scss
      # light: [flatly, styles/css/custom-light.scss]
      # dark: [darkly, styles/css/custom-dark.scss]
    css: styles/css/styles.css
    toc: true
    mainfont: "Lato"
    monofont: "Roboto Mono"
    linkcolor: "#3b89bc"
    cap-location: bottom
    page-layout: full
    code-fold: show
    code-overflow: wrap
    code-line-numbers: true
    code-link: true
    code-tools: true
    code-block-bg: "#0d1117"
    highlight-style: oblivion
    fig-align: center
    fig-width: 8
    fig-height: 4
    fig-asp: 0.618
    fig-dpi: 300
    fig-responsive: true
    link-external-newwindow: true
    link-external-filter: ^(?:http:|https:)\/\/(www\.)?fortietwo\.com
    footnotes-hover: true
    reference-location: document
